services:
  app:
    build: .
    ports:
      - "8080:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/myvocabulary.db
      AUDIO_DIR: /app/data/audio
      BOOKS_DIR: /app/data/books
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
